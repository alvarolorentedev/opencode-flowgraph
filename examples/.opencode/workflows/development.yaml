version: 1
name: development
description: Development with iterative quality checks

entry: developer

limits:
  max_steps: 12
  timeout_seconds: 3600
  node_timeout_seconds: 900
  max_result_retries: 2
  max_recovery_attempts: 3
  max_repeat_transitions: 5

nodes:
  developer:
    agent: developer
    next: reviewer

  reviewer:
    agent: reviewer
    routes:
      approved: security
      changes_requested: developer
      blocked: pause

  security:
    agent: security
    routes:
      approved: complete
      changes_requested: developer
      blocked: pause
